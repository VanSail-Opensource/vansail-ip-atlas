name: Atlas integration checks (no release)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOMAXPROCS: '2'
  GOMEMLIMIT: 5GiB
  PNPM_VERSION: 11.28.12

jobs:
  source-intake:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/production-23-warm-check'
    # Supplemental measurements use a single runner and the ordinary intake.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/build-private/toolcache
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/atlas-setup
      - name: Verify full actual reviewed source intake
        id: intake
        env:
          ATLAS_GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: python tools/hosted/runner_budget.py --report reports/intake-runner-budget.json -- python tools/hosted/source_intake.py
      - name: Compile and measure actual admitted data without publishing
        run: python tools/hosted/runner_budget.py --report reports/data-check-runner-budget.json -- python tools/hosted/production_data_check.py
      - name: Prepare isolated withdrawal case
        id: withdrawal_prepare
        if: >-
          !cancelled() && steps.intake.outcome == 'success'
        run: python tools/hosted/runner_budget.py --report reports/withdrawal-prepare-budget.json -- python tools/hosted/engineering_warm_probe.py withdrawal prepare
      - name: Measure isolated withdrawal case
        id: withdrawal_measure
        if: >-
          !cancelled() && steps.intake.outcome == 'success' && steps.withdrawal_prepare.outcome == 'success'
        run: python tools/hosted/runner_budget.py --report reports/withdrawal-measure-budget.json -- python tools/hosted/engineering_warm_probe.py withdrawal measure
      - name: Prepare isolated clock_advance case
        id: clock_advance_prepare
        if: >-
          !cancelled() && steps.intake.outcome == 'success'
        run: python tools/hosted/runner_budget.py --report reports/clock_advance-prepare-budget.json -- python tools/hosted/engineering_warm_probe.py clock_advance prepare
      - name: Measure isolated clock_advance case
        id: clock_advance_measure
        if: >-
          !cancelled() && steps.intake.outcome == 'success' && steps.clock_advance_prepare.outcome == 'success'
        run: python tools/hosted/runner_budget.py --report reports/clock_advance-measure-budget.json -- python tools/hosted/engineering_warm_probe.py clock_advance measure
      - name: Install the locked website dependencies
        run: npm exec --yes --package pnpm@11.28.12 -- pnpm --dir web install --frozen-lockfile --ignore-scripts
      - name: Package and inspect the real website without publishing
        run: python tools/hosted/runner_budget.py --report reports/package-check-budget.json -- python tools/hosted/production_workflow.py integration-package
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: source-free-intake-status
          path: |
            reports/source-intake.json
            reports/intake-runner-budget.json
            reports/withdrawal-*.json
            reports/clock_advance-*.json
            reports/production-data-check.json
            reports/production-lookup-integration.json
            reports/data-check-runner-budget.json
            reports/static-candidate.json
            reports/package-check-budget.json
          if-no-files-found: ignore
          retention-days: 7
      # Source payloads, fixture receipts, lineage and normalized partitions stay
      # on this ephemeral runner. Never upload its private working directories.
