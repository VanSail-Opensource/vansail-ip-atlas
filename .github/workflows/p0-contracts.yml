name: Atlas direct publisher diagnostics
on: workflow_dispatch
permissions:
  contents: read
jobs:
  origin:
    if: github.ref == 'refs/heads/codex/nov25-original-clock-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.4'
      - name: Check bounded HTTPS publisher transfers
        run: |
          curl --silent --show-error --proto '=https' --max-redirs 0 --max-time 30 --max-filesize 16384 --output /dev/null --write-out 'timestamp HTTP %{http_code} bytes %{size_download}\n' 'https://api.mullvad.net/trl/v1/timestamps/latest' || true
      - name: Verify the whole signed original on the standard transport
        env:
          ATLAS_ENGINEERING_ORIGINAL: '1'
        run: go test -v -count=1 ./internal/admission -run '^TestActualSignedPublisherTransport$'
  population:
    if: github.ref == 'refs/heads/codex/nov25-original-clock-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 5GiB
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/build-private/toolcache
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/atlas-setup
      - name: Check all original receipts
        env:
          ATLAS_GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: python tools/hosted/runner_budget.py --report reports/intake-runner-budget.json -- python tools/hosted/source_intake.py
      - name: Compare prior population with the additional original
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('.atlas-private/intake-report-v1.json').read_text())
          decisions = data['IntakeDecisions']
          assert len(decisions) == 22 and len({row['ID'] for row in decisions}) == 22
          additional, = [row for row in decisions if row['ID'] == 'mullvad-relay-geolocation']
          print('Additional source current:', additional['State'] == 'current')
          print('Prior sources current:', sum(row['State'] == 'current' for row in decisions if row is not additional))
          PY
