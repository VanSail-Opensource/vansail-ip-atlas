name: Complete publisher edition checks
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  direct:
    if: github.ref == 'refs/heads/codex/nov25-edition-edge-ci'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.4'
          cache: true
      - name: Validate two current complete originals and two historical transitions
        env:
          ATLAS_ENGINEERING_EDITION_CHECK: 'true'
          ATLAS_GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: go test -count=1 -v -timeout=8m ./internal/admission -run '^TestPublisherEditionsDirect$'
