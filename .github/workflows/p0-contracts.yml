name: Atlas direct prefix edition verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/nov25-explicit-prefix-diagnostic'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 5GiB
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/build-private/toolcache
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/atlas-setup
      - name: Check original representation and evidence
        env:
          ATLAS_GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          r=Path.cwd()
          paths={str(r/'internal'/pkg/'qa_original_test.go'):str(r/'tools/hosted/prefix-diagnostic'/f'{pkg}.txt') for pkg in ('acquire','admission')}
          (r/'build-private/qa-overlay.json').write_text(json.dumps({'Replace':paths}))
          PY
          go test -overlay build-private/qa-overlay.json -run '^TestOriginalEditionTransport$' -v -count=1 ./internal/acquire
          go test -overlay build-private/qa-overlay.json -run '^TestOriginalEditionAdmission$' -v -count=1 ./internal/admission
