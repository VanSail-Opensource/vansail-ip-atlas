name: Atlas integration checks (no release)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: atlas-engineering-changed-${{ github.run_id }}
  cancel-in-progress: false

env:
  GOMAXPROCS: '2'
  GOMEMLIMIT: 5GiB
  PNPM_VERSION: 11.28.12

jobs:
  source-intake:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/production-23-warm-check'
    # Supplemental measurements use a single runner and the ordinary intake.
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/build-private/toolcache
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Pin the exact prior diagnostic compiler
        shell: bash
        run: |
          cp tools/hosted/engineering_warm_probe.py "$RUNNER_TEMP/engineering-warm-probe.py"
          cp tools/hosted/verifywarm/main.go "$RUNNER_TEMP/verify-warm-rows.go"
          git checkout --detach 76095aa2f085d502c4f02892be72096bd352590c
      - uses: ./.github/actions/atlas-setup
      - name: Build an independent original-row verifier
        shell: bash
        run: |
          proof_dir=build-private/warm-proof
          mkdir -p "$proof_dir"
          cp "$RUNNER_TEMP/verify-warm-rows.go" "$proof_dir/main.go"
          go build -o build-private/verify-warm-rows "./$proof_dir"
      - name: Verify full actual reviewed source intake
        id: intake
        env:
          ATLAS_GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: python tools/hosted/runner_budget.py --report reports/intake-runner-budget.json -- python tools/hosted/source_intake.py
      - name: Prepare isolated warm_changed case
        id: warm_changed_prepare
        if: >-
          !cancelled() && steps.intake.outcome == 'success'
        run: python tools/hosted/runner_budget.py --report reports/warm_changed-prepare-budget.json -- python "$RUNNER_TEMP/engineering-warm-probe.py" warm_changed prepare
      - name: Measure isolated warm_changed case
        id: warm_changed_measure
        if: >-
          !cancelled() && steps.intake.outcome == 'success' && steps.warm_changed_prepare.outcome == 'success'
        run: python tools/hosted/runner_budget.py --report reports/warm_changed-measure-budget.json -- python "$RUNNER_TEMP/engineering-warm-probe.py" warm_changed measure
      - name: Prepare isolated warm_unchanged case
        id: warm_unchanged_prepare
        if: >-
          !cancelled() && steps.intake.outcome == 'success'
        run: python tools/hosted/runner_budget.py --report reports/warm_unchanged-prepare-budget.json -- python "$RUNNER_TEMP/engineering-warm-probe.py" warm_unchanged prepare
      - name: Measure isolated warm_unchanged case
        id: warm_unchanged_measure
        if: >-
          !cancelled() && steps.intake.outcome == 'success' && steps.warm_unchanged_prepare.outcome == 'success'
        run: python tools/hosted/runner_budget.py --report reports/warm_unchanged-measure-budget.json -- python "$RUNNER_TEMP/engineering-warm-probe.py" warm_unchanged measure
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: source-free-intake-status
          path: |
            reports/source-intake.json
            reports/intake-runner-budget.json
            reports/warm_changed-*.json
            reports/warm_unchanged-*.json
          if-no-files-found: ignore
          retention-days: 7
      # Source payloads, fixture receipts, lineage and normalized partitions stay
      # on this ephemeral runner. Never upload its private working directories.
