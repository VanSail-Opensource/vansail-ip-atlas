# VanSail IP Atlas: evidence-based quality, ASN context and /24 context.
schema_version: 3
contract_revision: 1
model_id: via-risk-v3-contract-1
contract: docs/scoring.md
contract_vectors: fixtures/scoring/contract-v1.json
range: [0, 100]
semantics:
  quality_100_is_better: true
  risk_1_is_worse: true
  unknown_is_not_clean: true
  classification_is_not_abuse_proof: true
  uncalibrated_risk_is_not_probability: true
  public_reasons_without_source_metadata: true
  public_score_requires_adequate_coverage: true
  explicit_authoritative_risk_can_be_shown_with_unrated_quality: true
  numeric_quality_requires_all_contributing_layers_assessed: true
  family_key: evidence_family
category_evidence:
  formula: "e(d,f)=max_{i in independent family f}(reliability_i*severity_i*specificity_i*2^(-age_hours_i/half_life_hours_d))"
  risk_per_layer: "R_layer=1-exp(-sum_d(beta_d*sum_f(e(d,f))))"
  aggregate_same_family: max
  no_duplicate_credit_for_aggregators: true
  reliability: "clamp(source_weight/100, 0, 1)"
  severity_default: 1.0
  future_timestamp_tolerance_hours: 24
  negative_age_policy: clamp_to_zero
  signals:
    malware:         { beta: 2.0, half_life_hours: 168, severity: 1.0, public_reason: malware }
    botnet:          { beta: 1.8, half_life_hours: 168, severity: 1.0, public_reason: botnet }
    c2:              { beta: 2.0, half_life_hours: 168, severity: 1.0, public_reason: command_control }
    abuse:           { beta: 1.4, half_life_hours: 336, severity: 1.0, public_reason: abuse }
    fraud:           { beta: 1.3, half_life_hours: 336, severity: 1.0, public_reason: fraud }
    scanner:         { beta: 0.9, half_life_hours: 72, severity: 1.0, public_reason: scanning }
    spam:            { beta: 0.85, half_life_hours: 168, severity: 1.0, public_reason: spam }
    tor:             { beta: 0.24, half_life_hours: 48, severity: 1.0, public_reason: tor }
    vpn:             { beta: 0.18, half_life_hours: 168, severity: 1.0, public_reason: vpn }
    proxy:           { beta: 0.28, half_life_hours: 72, severity: 1.0, public_reason: proxy }
    cloudflare_proxyip: { beta: 0.28, half_life_hours: 72, severity: 1.0, public_reason: proxy, merge_into: proxy }
    datacenter:      { beta: 0.12, half_life_hours: 720, severity: 1.0, public_reason: datacenter }
    hosting:         { beta: 0.10, half_life_hours: 720, severity: 1.0, public_reason: hosting }
  classification_penalty_note: Proxy, Tor, VPN and datacenter carry modest configurable quality adjustments; never equate them to abuse.
  indicator_specificity:
    exact: 1.0
    prefix: 0.65
    asn: 0.30
    proxy_subscription_literal_ip: 0.8
    unresolved_domain: 0.0
layers:
  weights: { exact: 0.55, explicit_prefix: 0.18, asn: 0.15, neighbors24: 0.12 }
  formula: "R=clamp(0,1,0.55*R_exact+0.18*R_prefix+0.15*C_asn*R_asn+0.12*C24*R24)"
  quality: "Q=round(100*(1-R)) if coverage_eligible else null"
  normalization: do_not_renormalize_missing_layers_to_zero-risk
  unknown_layers: null
  preserve_layer_presence_mask: true
  max_asn_contribution_to_total_risk: 0.15
  max_neighbor24_contribution_to_total_risk: 0.12
  required_layer_status: assessed
asn_wide:
  enabled: true
  direct_asn_indicators_priority: true
  calculate_from_unique_exact_ip_observations: true
  never_assume_unlisted_asn_addresses_clean: true
  no_simple_asn_malice_inference_from_one_host: true
  formula: "R_asn=max(R_explicit_asn, (1-exp(-u_asn/256))*C_asn_diversity)"
  confidence: "C_asn=min(1, independent_families/3)*min(1, distinct_positive_ips/64)"
  unique_risk_mass: "u_asn=sum_unique_current_exact_ips(R_exact_i)"
  diversity: "C_asn_diversity=min(1, independent_families/3)"
  moas_combination: maximum_per_origin_weighted_contribution
  public_context_band_millionths: { low_max_exclusive: 333334, medium_max_exclusive: 666667 }
  correlation_key: [asn, evidence_family, ip]
  require_current_prefix_to_asn_mapping: true
  handle_moas_as_multiple_origins: true
  never_infer_customer_asn_risk_from_provider_asn: true
  output: [asn_risk_band, asn_context_reason]
ipv4_24:
  enabled: true
  label: Class C /24
  source_prefix_bits: 24
  addresses_per_prefix: 256
  exclude_queried_ip: true
  exact_observations_only: true
  independence: per_unique_positive_address_and_evidence_family
  denominator_semantics: address_count_is_not_safe-coverage
  density_formula: "D24=sum_{i != queried_ip}(min(1,R_exact_i))/255"
  risk_formula: "R24=1-exp(-16*D24)"
  support_formula: "C24=min(1,unique_positive_neighbor_ips/16)*min(1,independent_families/3)"
  output:
    - positive_observed_count
    - observed_density_lower_bound
    - risk_distribution
    - usage_type_distribution_observed
    - proxy_vpn_tor_counts
    - abused_count
    - dominant_asn
    - subdivision_known
    - ip_cell_reason_flags
    - aggregate_quality
  no_unobserved_host_imputation: true
  aggregate_quality: null_unless_all_256_cells_quality_eligible_then_half_up_mean
  classful_boundary_is_visual_label_only: true
  ipv6_equivalent: separate_ipv6_prefix_profile_not_class_c
coverage:
  family_key: evidence_family
  min_independent_assessment_families: 2
  numeric_quality_requires_all_layers: true
  qualifying_families: intersection_of_complete_families_across_all_required_scopes
  numeric_quality_address_family: ipv4_only
  positive_only_absence_is_unknown: true
  authoritative_positive_emits_reasons_even_if_score_null: true
  min_current_source_age_hours: 0
  max_source_age_hours: 720
  data_quality_flag: unrated_when_insufficient
  confidence_bands:
    low_min_families: 2
    medium_min_families: 3
    high_min_families: 4
    unrated_when_incomplete: true
  calibration:
    require_holdout_labels_for_probability: true
    monitor_fpr_per_usage_type: true
    monitor_residential_fpr: true
    monitor_asn_and_subnet_bias: true
    thresholds_are_hypotheses_not_measured: true
  confidence_public: confidence_band_only
geo_fusion:
  family_vote: highest_reliability_current_lpm_then_unknown_on_equal_weight_conflict
  winning_margin_denominator: all_nonmissing_family_vote_weights_at_same_hierarchy_level
  country_min_support_families: 1
  city_min_support_families: 2
  region_min_support_families: 2
  winning_margin: 0.15
  coordinate_source: winning_city_family_only
  average_coordinates: false
  anycast_suppresses_city_and_map: true
  hierarchy: physical_country_then_region_then_city
  coordinate_winner: reliability_desc_precision_desc_canonical_value_bytes_asc
rounding:
  internal: binary64_canonical_order_no_intermediate_rounding
  quality_integer: half_up
  serialization: follow_binary_format_quantization
usage_fusion:
  direct_evidence_only: true
  unresolved_conflict: unknown
  do_not_infer_from_risk_or_country: true
usage_types:
  enum: [residential, business, mobile, datacenter, hosting, education, government, unknown]
  rule: independently_classified_and_conflict_aware
  type_not_equivalent_to_malicious: true
broadcast_native:
  mode_enum: [native, broadcast_or_routed, unknown]
  no_inference_from_country_disagreement_alone: true
  anycast_separate: true
  ipv4_directed_broadcast_separate: true
  unknown_default: true
  do_not_score_mode_without_positive_evidence: true
public_output:
  reason_flags:
    - malware
    - botnet
    - command_control
    - abuse
    - fraud
    - scanning
    - spam
    - tor
    - vpn
    - proxy
    - datacenter
    - hosting
    - asn_context
    - subnet_context
  signal_mapping:
    c2: command_control
    scanner: scanning
    cloudflare_proxyip: proxy
  no_source_ids: true
  no_source_names: true
  no_source_counts: true
  no_protocol_or_port: true
  no_raw_evidence: true
  reason_can_be_true_even_when_score_unrated: true
regression:
  score_bounds: [0, 100]
  monotonic_for_additional_independent_positive_evidence: true
  do_not_double_count_same_family: true
  neighbor_self_exclusion: true
  no_asn_wide_false_positive_propagation: true
  deterministic_sorting_and_rounding: true
  property_based_tests: true
