name: Atlas automatic exact-artifact production promotion

on:
  workflow_run:
    workflows: ["Atlas qualified production Pages preview"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: Successful exact-head upstream run
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: atlas-production-promotion
  cancel-in-progress: false

jobs:
  promotion:
    if: github.repository == 'VanSail-Opensource/vansail-ip-atlas' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    environment: atlas-production
    timeout-minutes: 360
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 5GiB
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/build-private/toolcache
      GH_TOKEN: ${{ github.token }}
      ATLAS_STATE_AGE_IDENTITY: ${{ secrets.ATLAS_STATE_AGE_IDENTITY }}
      ATLAS_STATE_AGE_RECIPIENT: ${{ vars.ATLAS_STATE_AGE_RECIPIENT }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/atlas-setup
      - name: Verify trusted exact-head upstream
        id: context
        run: python tools/hosted/production_workflow.py context --kind promotion
      - name: Restore authenticated encrypted state
        run: python tools/hosted/runner_budget.py --report reports/checkpoint-restore-budget.json -- python tools/hosted/checkpoint.py restore --kind preview --run-id "$ATLAS_UPSTREAM_RUN"
      - name: Resolve original frozen candidate
        id: candidate
        run: |
          python - <<'PY'
          import json, os
          state=json.load(open('.atlas-private/workflow-context.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('run_id='+str(state['candidate_run_id'])+'\n')
          PY
      - uses: actions/download-artifact@v8.0.2
        with:
          name: atlas-production-public
          path: build-private/frozen-production
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v8.0.2
        with:
          name: production-candidate-evidence
          path: reports
          run-id: ${{ steps.candidate.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Run bounded production stage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ATLAS_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          ATLAS_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: python tools/hosted/runner_budget.py -- python tools/hosted/production_workflow.py promotion
      - name: Encrypt immutable state for the next trusted job
        run: python tools/hosted/runner_budget.py --report reports/checkpoint-pack-budget.json -- python tools/hosted/checkpoint.py pack --kind promotion
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: atlas-promotion-checkpoint
          path: |
            build-private/checkpoint/checkpoint.tar.gz.age
            build-private/checkpoint/envelope.json
          compression-level: 0
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: production-promotion-status
          path: |
            reports/rollback.json
            reports/production-authorization.json
            reports/pages-deployment.json
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7.0.0
        with:
          name: atlas-promotion-checkpoint-index
          path: build-private/checkpoint/envelope.json
          retention-days: 7
          if-no-files-found: error
      - name: Remove plaintext state
        if: always()
        run: python tools/hosted/production_workflow.py cleanup-private
