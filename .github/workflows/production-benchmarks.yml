name: Atlas parallel production benchmark cases

on:
  workflow_dispatch:
    inputs:
      upstream_run_id:
        description: Completed exact-head frozen candidate run
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: atlas-production-benchmarks-${{ inputs.upstream_run_id }}
  cancel-in-progress: false

jobs:
  benchmark:
    name: benchmark-${{ matrix.scenario }}-${{ matrix.sample }}
    if: github.repository == 'VanSail-Opensource/vansail-ip-atlas' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: atlas-private-build
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        scenario: [cold_full, warm_unchanged, warm_changed, clock_advance, withdrawal]
        sample: [1, 2, 3]
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 5GiB
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/build-private/toolcache
      GH_TOKEN: ${{ github.token }}
      ATLAS_STATE_AGE_IDENTITY: ${{ secrets.ATLAS_STATE_AGE_IDENTITY }}
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/atlas-setup
      - name: Verify completed exact-head frozen candidate
        run: python tools/hosted/production_workflow.py context --kind benchmark_cases
      - name: Restore original authenticated candidate state
        run: python tools/hosted/runner_budget.py --report reports/checkpoint-restore-budget.json -- python tools/hosted/checkpoint.py restore --kind candidate --run-id "$ATLAS_UPSTREAM_RUN"
      - uses: actions/download-artifact@v8.0.2
        with:
          name: atlas-production-public
          path: build-private/frozen-production
          run-id: ${{ env.ATLAS_UPSTREAM_RUN }}
          github-token: ${{ github.token }}
      - name: Measure one complete real benchmark case
        env:
          ATLAS_CASE: ${{ matrix.scenario }}
          ATLAS_SAMPLE: ${{ matrix.sample }}
        run: python tools/hosted/runner_budget.py --report reports/runner-budget.json -- python tools/hosted/production_workflow.py benchmark-case --scenario "$ATLAS_CASE" --sample "$ATLAS_SAMPLE"
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: atlas-build-case-${{ github.run_attempt }}-${{ matrix.scenario }}-${{ matrix.sample }}
          path: |
            reports/production-build-case.json
            reports/runner-budget.json
          if-no-files-found: error
          retention-days: 7
      - name: Remove all plaintext state and replay workspaces
        if: always()
        run: python tools/hosted/production_workflow.py cleanup-private
