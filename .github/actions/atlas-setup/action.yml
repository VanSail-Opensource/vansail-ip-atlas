name: Locked Atlas production tools
description: Install pinned tools; all mutable caches stay in the accounted workspace
runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7.0.0
      with:
        go-version: '1.27.4'
        cache: false
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: '3.13.7'
    - uses: actions/setup-node@v7.1.0
      with:
        node-version: '26.13.1'
    - shell: bash
      run: |
        mkdir -p build-private/bin build-private/cache reports
        echo "GOCACHE=$GITHUB_WORKSPACE/build-private/cache/go-build" >> "$GITHUB_ENV"
        echo "GOMODCACHE=$GITHUB_WORKSPACE/build-private/cache/go-mod" >> "$GITHUB_ENV"
        echo "npm_config_cache=$GITHUB_WORKSPACE/build-private/cache/npm" >> "$GITHUB_ENV"
        echo "PIP_CACHE_DIR=$GITHUB_WORKSPACE/build-private/cache/pip" >> "$GITHUB_ENV"
        echo "$GITHUB_WORKSPACE/build-private/bin" >> "$GITHUB_PATH"
    - shell: bash
      run: |
        python -m pip install -r tools/requirements.txt
        GOBIN="$GITHUB_WORKSPACE/build-private/bin" go install filippo.io/age/cmd/age@v1.3.0 filippo.io/age/cmd/age-keygen@v1.3.0
        go build -o build-private/atlas ./cmd/atlas
