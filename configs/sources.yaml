schema_version: 3
description: 'VanSail IP Atlas: download-only catalog. Proxy subscriptions yield public literal IP evidence only;
  stale or uncertain sources are not published. No per-IP provenance; reviewed dataset credits are global only.'
build:
  profile: github-actions-private-standard
  incremental: true
  reproducible: true
  timezone: UTC
  runner:
    cpu_budget: 2
    physical_memory_mib: 8192
    ephemeral_disk_mib: 14336
    go_memory_limit_mib: 5120
    rss_abort_mib: 6656
    scratch_abort_mib: 10240
    soft_deadline_minutes: 35
  download:
    max_workers: 3
    per_host_workers: 1
    timeout_seconds: 45
    retry_attempts: 2
    redirect_limit: 3
    reject_private_redirects: true
    max_total_compressed_mib: 2560
    max_one_compressed_mib: 1024
    max_one_uncompressed_mib: 3072
    max_line_bytes: 1048576
    max_archive_entries: 10000
    user_agent: IPDB-BulkBuilder/0.1 (+CONTACT_EMAIL_REQUIRED)
  normalize:
    sort_buffer_mib: 96
    max_parallel_partitions: 2
    record_schema_version: 3
    preserve_source_evidence: true
    dedupe:
      byte_hash: sha256
      canonical_record_hash: sha256
      family_vote: max
      unknown_dependence_cap: true
      subscription_ip_identity: netip.Addr with same independently observed family
      do_not_count_aggregator_votes_as_independent: true
    output_fields_allowlist:
    - physical_country
    - registration_country
    - region
    - city
    - latitude
    - longitude
    - coordinate_precision
    - asn
    - as_name
    - asn_country
    - organization
    - isp
    - origins
    - usage_type
    - assignment_mode
    - anycast
    - ipv4_directed_broadcast
    - quality
    - quality_status
    - confidence_band
    - reason_flags
    - exact_contribution
    - prefix_contribution
    - asn_contribution
    - neighbor_contribution
    - asn_risk
    - asn_risk_band
    - ipv4_24_profile
    - rpki_status
    - bgp_origins
    - bgp_paths
    - as_relationships
    - network_class
    - tier1_candidate
    - stability
    remove_fields:
    - timezone
    - postal
    - continent
    - collector
    - latency
    - protocol
    - port
    - credentials
    - hostname
    - domain
    - source_id
    - source_name
    - source_url
    - raw_path
    - source_count
    - per_source_evidence
    public_provenance: false
    source_provenance_internal_only: true
  storage:
    format: VIA3
    schema_version: 3
    checksum: sha256
    byte_order: little
    compression: zstd
    zstd_level: 3
    target_chunk_kib: 128
    max_hot_chunk_kib: 1024
    ipv4_partition_bits: 16
    ipv6_sparse_index_bits: 16
    use_inherited_prefix_overlay: true
    content_addressed: true
    publish_backend: cloudflare-pages-direct-upload
    publish_only_license_allow: true
    keep_previous_releases: 2
    public_asset_prefix: /_atlas/objects/
    max_single_asset_mib: 24
    max_total_files: 18500
    manifest_integrity: sha256
    repack_by_binary_bytes_not_prefix_count: true
    browser_release_pinning: true
    public_content_sections:
    - ip
    - geo
    - network
    - usage
    - quality
    - reason_flags
    - subnet24
    - asn
    - bgp
    - tier1
    - coordinates
    forbid_sections:
    - source
    - provenance
    - protocol
    - port
    - latency
    - collector
    - timezone
    - postal
    - continent
    - domains
    - hostname
    - credential
    remove_stale_inputs: true
    retain_only_current_and_previous_release: true
    format_version: 3
    max_decoded_section_mib: 64
    max_total_decoded_mib: 256
    browser_deploy_profile:
      max_decoded_object_mib: 32
      max_live_decoded_mib: 96
      max_answer_mib: 8
      max_origins_per_answer: 4096
      max_retained_path_asns_per_answer: 49152
  confidence:
    unknown_is_not_safe: true
    independent_family_cap: true
    geo_min_margin: 0.15
    city_min_support_families: 2
    max_stale_source_days: 30
    calibration_required_for_probability_label: true
    stale_policy: remove_from_current_release-and-gc-expired-cache
    age_clock: upstream_last_content_publication_not_last_successful_HTTP_304
    unknown_upstream_timestamp: quarantine-until-verified
    min_numeric_risk_families: 2
    confidence_band_families:
      low: 2
      medium: 3
      high: 4
    future_timestamp_tolerance_hours: 24
    numeric_quality_requires_all_layers: true
  bgp:
    download_mode: selected-snapshots
    mrt_enabled: false
    collectors:
    - rrc01
    - rrc03
    - rrc06
    - route-views2
    max_mrt_sources_per_run: 2
    max_mrt_compressed_mib_per_run: 1024
    preserve_raw_as_path: true
    normalize_for_graph_only: true
    max_paths_per_origin: 12
    max_visible_graph_nodes: 24
    protected_hop_depth: 2
    max_backbone_exits_per_second_hop: 3
    collapse_tier1_edges: true
    paths_observed_only_by_default: true
    tier1_extraction_config: configs/tier1.yaml
    tier1_membership_mode: derive_from_versioned_sources
    fixed_asn_allowlist_allowed: false
    relationship_classes:
    - transit_upstream
    - peer
    - customer
    - sibling
    - unknown
    relationship_direction: perspective_of_queried_origin
    retain_relation_conflict_evidence: true
    relationship_unknown_not_peer: true
    edge_classification_from: caida-asrel-and-observed-mrt
    inferred_not_observed: true
    graph_layout_reference: VanSail-Carpool web/src/components/ip-lookup/
    browser_layout_reference: Archeb/peer.as
    tier1_data_degradation: unclassified-label-not-fixed-fallback
    snapshot_discovery_required: true
    hardcoded_snapshot_date_forbidden: true
    minimum_independent_path_families: 2
    mrt_acquisition: two-families-sequential-cold-build-with-shared-byte-budget
  release:
    atomic_manifest_pointer: current.json
    frontend_api_calls: false
    retain_attribution: true
    verify_all_chunks_before_publish: true
    owner_signoff_required: true
    owner_signoff_file: configs/release-approval.yaml
    static_same_origin_required: true
    static_backend_fallback: none-fail-deploy-on-pages-budget
    deployment_mode: atomic-pages-direct-upload
    include_all_database_assets_in_deploy: true
    generations_in_same_deploy: 2
    prerender_only: true
    deploy_dir: web/.output/public
    deploy_command: pnpm exec wrangler pages deploy web/.output/public --project-name "$CF_PAGES_PROJECT" --branch
      main
    no_runtime_functions: true
    max_generated_static_bytes_mib: 3072
    pages_limits_checked_on: '2026-10-30'
    pages_free_max_files: 20000
    pages_paid_max_files: 100000
    pages_max_asset_mib: 25
    pages_build_timeout_minutes: 20
    pages_build_work: none-ci-prebuild-only
    publish_no_source_provenance: true
    public_provenance: false
    public_source_rights_policy: reviewed-redistribution-with-required-global-dataset-credits
    maximum_snapshot_age_hours: 720
    hosted_regression_required: true
    hosted_performance_required: true
    quality_gates_required: true
    no_chrome_polyfills: true
    database_asset_root: web/.output/public/_atlas/
  quality:
    scoring_config: configs/scoring.yaml
    ipv4_subnet_profile_bits: 24
    ipv6_context_prefix_bits: 64
    ipv6_subnet_profile_analog_not_class_c: true
    aggregate_sparse_only: true
    store_exact_and_subnet_separately: true
    zero_support_status: unknown
    no_implicit_negative_from_unlisted_ips: true
    broadcast_native:
      mode_field: assignment_mode
      modes:
      - native
      - broadcast_or_routed
      - unknown
      require_explicit_evidence: true
      weak_inference_relabel_as: candidate_not_verified
      ipv4_broadcast_address_is_separate_boolean: true
      anycast_is_separate_boolean: true
      unknown_by_default: true
      allow_heuristic_as_proof: false
    asn_wide_risk_layer: true
    score_reasons_public: true
    score_evidence_sources_public: false
    usage_types:
    - residential
    - business
    - mobile
    - datacenter
    - hosting
    - education
    - government
    - unknown
    proxyip_is_proxy: true
    proxy_subscriptions_decode_mode: literal-ip-only
    no_dns_resolution: true
    ipv4_subnet_profile_name: Class C /24 profile
    numeric_quality_address_family: ipv4-only
  ui:
    config: configs/web.yaml
    framework: nuxt
    output: static-pages
    no_duplicate_facts_across_panels: true
  project: VanSail IP Atlas
  proxy_subscription:
    enabled: true
    decode_stage: normalizer-only
    no_remote_dns: true
    no_network_probes: true
    no_recursive_subscription_fetch: true
    allowed_container_formats:
    - plaintext
    - base64
    - mihomo-yaml
    - singbox-json
    recognized_uri_schemes:
    - vless
    - vmess
    - trojan
    - ss
    - ssr
    - hy
    - hy2
    - hysteria
    - hysteria2
    - tuic
    - anytls
    strict_ip_literal: true
    require_public_global_ip: true
    ignore_domain_hosts: true
    discard:
    - hostname
    - domains
    - credential
    - password
    - uuid
    - user_info
    - sni
    - ws_path
    - query
    - fragment
    - port
    - protocol
    - latency
    - remarks
    emit:
    - ip
    - proxy_reason_flag
    - observation_timestamp
    max_nested_base64_depth: 2
    max_encoded_line_bytes: 131072
    max_yaml_nodes: 500000
    max_total_extracted_ips_per_source: 2000000
    dedupe_scope: unique-ip-and-evidence-family
    expiry_hours: 168
    do_not_infer_exit_ip_from_server_ip: true
    evidence_family: public-subscription-aggregators
  testing:
    hosted_ci_required: true
    regression:
    - go-unit
    - go-race
    - go-fuzz-smoke
    - binary-golden
    - go-typescript-parity
    - source-fixtures
    - routing-semantic
    - score-boundaries
    - stale-expiry
    - subscription-uri-decoder
    - nuxt-component
    - chromium-e2e
    - a11y
    - pages-preview
    performance:
    - benchmark-lookup
    - benchmark-build
    - memory-peak
    - disk-peak
    - compressed-payload
    - lcp
    - inp
    - graph-framerate
    quality_gates:
    - no-stale-inputs
    - no-unsupported-ip-classification
    - no-source-provenance-output
    - calibration-backtests
    - false-positive-sentinel
    - finite-score
    - reproducible-output
    - all-manifest-shards-present
  source_policy:
    evidence_family_key: evidence_family
    subscription_evidence_family: public-subscription-aggregators
    active_requires_fixture: true
    active_requires_publication_proof: true
    active_requires_public_redistribution: true
    active_forbidden_if_attribution_required: false
    active_requires_reviewed_attribution_when_required: true
    unknown_independence_defaults_to_one_family: true
    runtime_state_is_not_persisted: true
    authoritative_publication_headers: []
    certification_root: fixtures/source-certification/
source_defaults:
  requires_redistribution_approval: true
  on_failure: recompute-with-only-verified-current-sources
  validate_schema_before_ingestion: true
  dedupe_by_correlation_group: false
  fetch_live_ip_lookup_api: false
  max_public_age_hours: 720
  state_on_unknown_freshness: quarantined
  output_source_metadata: false
  requires_observed_fixture: true
  requires_publication_proof: true
  requires_public_redistribution_without_attribution: false
  requires_reviewed_attribution_when_required: true
  active_without_fixture_forbidden: true
  unknown_freshness_action: quarantine-and-withdraw
