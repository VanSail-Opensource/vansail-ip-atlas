name: Atlas integration checks (no release)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: atlas-real-rebuild-retest-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  source-intake:
    name: rebuild-${{ matrix.scenario }}
    if: github.ref == 'refs/heads/codex/measure-clock-aware-full-data'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        scenario: [withdrawal]
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 5GiB
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/build-private/toolcache
      ATLAS_REPLAY_COMPILER: a8521f3932b3747c0d77239777092ea2a7721781
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the exact code under review
        shell: bash
        run: |
          cp tools/hosted/rebuild_retest.py "$RUNNER_TEMP/atlas-rebuild-retest.py"
          git checkout --detach "$ATLAS_REPLAY_COMPILER"
      - uses: ./.github/actions/atlas-setup
      - name: Independently verify all reviewed sources
        env:
          ATLAS_GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: python tools/hosted/runner_budget.py --report reports/intake-runner-budget.json -- python tools/hosted/source_intake.py
      - uses: actions/download-artifact@v8.0.2
        with:
          name: atlas-production-public
          path: build-private/frozen-production
          run-id: '45794200152'
          github-token: ${{ github.token }}
      - name: Measure actual isolated rebuild with production accounting
        env:
          ATLAS_REBUILD_SCENARIO: ${{ matrix.scenario }}
        run: python tools/hosted/runner_budget.py --report reports/rebuild-retest-budget.json -- python "$RUNNER_TEMP/atlas-rebuild-retest.py" "$ATLAS_REBUILD_SCENARIO"
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: atlas-retest-${{ matrix.scenario }}
          path: |
            reports/source-intake.json
            reports/intake-runner-budget.json
            reports/rebuild-retest.json
            reports/rebuild-retest-budget.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Delete plaintext state
        if: always()
        run: python tools/hosted/production_workflow.py cleanup-private
