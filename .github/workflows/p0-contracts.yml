name: Atlas original edition comparison
on: workflow_dispatch
permissions:
  contents: read
jobs:
  population:
    if: github.ref == 'refs/heads/codex/nov25-publisher-edition-races'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      GOMAXPROCS: '2'
      GOMEMLIMIT: 5GiB
      RUNNER_TOOL_CACHE: ${{ github.workspace }}/build-private/toolcache
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false
      - uses: ./.github/actions/atlas-setup
      - name: Record only bounded encrypted edition controls
        env:
          ATLAS_GITHUB_METADATA_TOKEN: ${{ github.token }}
        run: |
          python tools/hosted/publisher_rollover_probes.py >build-private/engineering-control.log 2>&1 &
          probe_pid=$!
          status=0
          python tools/hosted/runner_budget.py --report reports/intake-runner-budget.json -- python tools/hosted/source_intake.py || status=$?
          wait "$probe_pid"
          exit "$status"
      - name: Seal original consistency evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          import subprocess
          from pathlib import Path
          import yaml
          private=Path('.atlas-private')
          known=sorted(row['id'] for row in yaml.safe_load(Path('configs/sources.yaml').read_bytes())['sources'])
          receipts=[json.loads(line) for line in (private/'engineering-clock-trace.jsonl').read_text().splitlines()]
          assert len(known)==len(receipts)==21
          public_keys = {'current','quarantined','missing','invalid','unsupported','disabled','active','payload_missing','publication_not_payload_bound','asset_unavailable','publication_metadata_unavailable','publication_expired','content_expired'}
          decisions=[(known.index(source),int(started),int(finished),state=='current',reason if reason in public_keys else 'other',int(clock)) for source,started,finished,state,reason,clock in receipts]
          snapshots=[json.loads(line) for line in (private/'engineering-publisher-snapshots.jsonl').read_text().splitlines()]
          assert len(snapshots)==13
          payload=json.dumps({'decisions':decisions,'snapshots':snapshots}).encode()
          assert len(payload)<100000
          with Path('reports/engineering-edition-control.age').open('wb') as out: subprocess.run(['age','-r','age1ffkcnju6xj7mknrscpccz73zq5uczg0vju7krsw5f9lu4x4gxfksr3j0y4'], input=payload,stdout=out, check=True)
          print('Encrypted diagnostic count:',len(decisions), len(snapshots))
          PY
      - uses: actions/upload-artifact@v7.0.0
        if: always()
        with:
          name: engineering-encrypted-edition-control
          path: reports/engineering-edition-control.age
          retention-days: 1
          if-no-files-found: error
